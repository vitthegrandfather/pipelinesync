[project]
name = "pipelinesync"
version = "1.0.0"
description = "CRM lead routing and webhook automation platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "celery>=5.4.0",
  "httpx>=0.28.0",
  "structlog>=24.4.0",
  "phonenumbers>=8.13.0",
  "bcrypt>=4.0.0",
  "email-validator>=2.2.0",
  "PyJWT>=2.9.0",
  "python-multipart>=0.0.9",
  "greenlet>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[project.scripts]
pipelinesync-seed = "app.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "E741", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

